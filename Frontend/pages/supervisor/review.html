<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <!-- Applies the saved light/dark choice before first paint -->
  <script src="../../js/theme.js"></script>
  <title>OPSTS – Review Submissions</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
  <link rel="stylesheet" href="../../css/tailwind.css" />
</head>
<body>
<div class="app-shell">

  <aside class="sidebar">
    <div class="sidebar-brand">
      <img src="../../assets/images/logo.png" alt="OPSTS Logo" />
      <div class="brand-text">OPSTS<small>Supervisor Portal</small></div>
    </div>
    <div class="sidebar-user">
      <div class="avatar" id="sideAvatar"></div>
      <div>
        <div class="u-name" id="sideUserName"></div>
        <div class="u-role" id="sideUserMeta"></div>
      </div>
    </div>
    <nav class="sidebar-nav" aria-label="Primary">
      <div class="nav-section">Main</div>
      <button type="button" class="nav-item" data-page="dashboard.html">
        <span class="nav-icon"><i class="fa-solid fa-house"></i></span><span class="nav-label">Dashboard</span>
      </button>
      <button type="button" class="nav-item" data-page="students.html">
        <span class="nav-icon"><i class="fa-solid fa-user-graduate"></i></span><span class="nav-label">My Students</span>
      </button>
      <button type="button" class="nav-item active" data-page="review.html" aria-current="page">
        <span class="nav-icon"><i class="fa-solid fa-pen-to-square"></i></span><span class="nav-label">Review Submissions</span>
        <span class="nav-badge hidden" id="reviewBadge"></span>
      </button>
      <button type="button" class="nav-item" data-page="progress.html">
        <span class="nav-icon"><i class="fa-solid fa-chart-bar"></i></span><span class="nav-label">Monitor Progress</span>
      </button>
      <div class="nav-section">Communication</div>
      <button type="button" class="nav-item" data-page="schedule.html">
        <span class="nav-icon"><i class="fa-solid fa-calendar-plus"></i></span><span class="nav-label">Schedule Meetings</span>
      </button>
      <button type="button" class="nav-item" data-page="notifications.html">
        <span class="nav-icon"><i class="fa-solid fa-bell"></i></span><span class="nav-label">Notifications</span>
        <span class="nav-badge hidden" id="ntfBadge"></span>
      </button>
      <div class="nav-section">Account</div>
      <button type="button" class="nav-item" data-page="profile.html">
        <span class="nav-icon"><i class="fa-solid fa-circle-user"></i></span><span class="nav-label">My Profile</span>
      </button>
    </nav>
    <div class="sidebar-footer">
      <button class="btn-logout" id="logoutBtn"><i class="fa-solid fa-right-from-bracket"></i> Sign Out</button>
    </div>
  </aside>

  <div class="main" id="main-content" role="main" tabindex="-1">
    <div class="topbar">
      <div class="topbar-left">
        <div class="topbar-title">Review Submissions <span>Give feedback on student work</span></div>
      </div>
      <div class="topbar-actions">
        <button type="button" class="icon-btn" id="notifBtn" aria-label="Notifications"><i class="fa-solid fa-bell"></i><span class="dot hidden" id="ntfDot"></span></button>
        <button type="button" class="icon-btn" id="profileBtn" aria-label="My profile"><i class="fa-solid fa-circle-user"></i></button>
      </div>
    </div>

    <div class="page-content">
      <div class="page-header">
        <h1>Review Submissions</h1>
        <p>Review student chapter submissions and provide feedback.</p>
      </div>

      <!-- Filter toolbar -->
      <div class="review-toolbar">
        <div class="filter-group">
          <label for="filterStudent">Student:</label>
          <select id="filterStudent">
            <option value="all">All Students</option>
          </select>
        </div>
        <div class="filter-group">
          <label for="filterStatus">Status:</label>
          <select id="filterStatus">
            <option value="all">All</option>
            <option value="Under Review">Pending Review</option>
            <option value="Approved">Approved</option>
            <option value="Needs Revision">Needs Revision</option>
          </select>
        </div>
      </div>

      <div id="reviewList"></div>

    </div>
  </div>
</div>

<!-- Feedback Modal -->
<div class="modal-overlay" id="feedbackModal">
  <div class="modal">
    <div class="modal-header">
      <h2><i class="fa-solid fa-comments"></i> Give Feedback</h2>
      <button type="button" class="modal-close" id="closeFeedbackModal" aria-label="Close dialog"><i class="fa-solid fa-xmark"></i></button>
    </div>
    <div class="modal-body">
      <div id="feedbackModalInfo"></div>
      <form id="feedbackForm" novalidate>
        <div class="form-group">
          <label for="feedbackComment">Comments</label>
          <textarea
            id="feedbackComment"
            name="comment"
            placeholder="Write your feedback for the student…"
            rows="5"
          ></textarea>
        </div>
        <div class="form-group">
          <label for="feedbackDecision">Decision</label>
          <select id="feedbackDecision" name="decision">
            <option value="Approved">Approve</option>
            <option value="Needs Revision">Request Revision</option>
          </select>
        </div>
      </form>
    </div>
    <div class="modal-footer">
      <button class="btn btn-ghost" id="cancelFeedbackBtn">Cancel</button>
      <button class="btn btn-primary" id="submitFeedbackBtn"><i class="fa-solid fa-paper-plane"></i> Submit Feedback</button>
    </div>
  </div>
</div>

<div id="toast-container"></div>

<script src="../../js/config.js"></script>
<script src="../../js/session.js"></script>
<script src="../../js/data.js"></script>
<script src="../../js/utils.js"></script>
<script src="../../js/api.js"></script>
<script src="../../js/app.js"></script>
<script src="../../js/a11y.js"></script>
<script src="../../js/notifications.js"></script>
<script src="../../js/supervisor.js"></script>
</body>
</html>
