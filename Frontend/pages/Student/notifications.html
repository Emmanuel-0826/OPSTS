<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>OPSTS – Notifications</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
  <link rel="stylesheet" href="../../css/style.css" />
  <link rel="stylesheet" href="../../css/dashboard.css" />
  <link rel="stylesheet" href="../../css/student.css" />
</head>
<body>
<div class="app-shell">

  <!-- ═══════════════ SIDEBAR ═══════════════ -->
  <aside class="sidebar">
    <div class="sidebar-brand">
      <img src="../../assets/images/opsts-logo.png" alt="OPSTS Logo" />
      <div class="brand-text">OPSTS<small>Student Portal</small></div>
    </div>
    <div class="sidebar-user">
      <div class="avatar" id="sideAvatar"></div>
      <div>
        <div class="u-name" id="sideUserName"></div>
        <div class="u-role" id="sideUserMeta"></div>
      </div>
    </div>
    <nav class="sidebar-nav">
      <div class="nav-section">Main</div>
      <div class="nav-item" data-page="dashboard.html">
        <span class="nav-icon"><i class="fa-solid fa-house"></i></span><span class="nav-label">Dashboard</span>
      </div>
      <div class="nav-item" data-page="submissions.html">
        <span class="nav-icon"><i class="fa-solid fa-upload"></i></span><span class="nav-label">My Submissions</span>
      </div>
      <div class="nav-item" data-page="feedback.html">
        <span class="nav-icon"><i class="fa-solid fa-comments"></i></span><span class="nav-label">Feedback</span>
        <span class="nav-badge hidden" id="fbBadge"></span>
      </div>
      <div class="nav-item" data-page="progress.html">
        <span class="nav-icon"><i class="fa-solid fa-chart-line"></i></span><span class="nav-label">Progress</span>
      </div>
      <div class="nav-section">Communication</div>
      <div class="nav-item" data-page="meetings.html">
        <span class="nav-icon"><i class="fa-solid fa-calendar-days"></i></span><span class="nav-label">Meetings</span>
      </div>
      <div class="nav-item active" data-page="notifications.html">
        <span class="nav-icon"><i class="fa-solid fa-bell"></i></span><span class="nav-label">Notifications</span>
        <span class="nav-badge hidden" id="ntfBadge"></span>
      </div>
      <div class="nav-section">Account</div>
      <div class="nav-item" data-page="profile.html">
        <span class="nav-icon"><i class="fa-solid fa-circle-user"></i></span><span class="nav-label">My Profile</span>
      </div>
    </nav>
    <div class="sidebar-footer">
      <button class="btn-logout" id="logoutBtn"><i class="fa-solid fa-right-from-bracket"></i> Sign Out</button>
    </div>
  </aside>

  <!-- ═══════════════ MAIN ═══════════════ -->
  <div class="main">
    <div class="topbar">
      <div class="topbar-left">
        <div class="topbar-title">Notifications <span>Updates &amp; reminders</span></div>
      </div>
      <div class="topbar-actions">
        <button class="icon-btn" id="notifBtn">
          <i class="fa-solid fa-bell"></i> <span class="dot hidden" id="ntfDot"></span>
        </button>
        <button class="icon-btn" id="profileBtn"><i class="fa-solid fa-circle-user"></i></button>
      </div>
    </div>

    <div class="page-content">
      <div class="page-header">
        <h2>Notifications</h2>
        <p>Stay updated on feedback, meetings, and deadlines.</p>
      </div>

      <div class="card">
        <div class="card-header">
          <h3><i class="fa-solid fa-bell"></i> All Notifications</h3>
          <button class="btn btn-outline btn-sm" id="markAllReadBtn">
            Mark All as Read
          </button>
        </div>
        <div class="notif-list" id="notifList"></div>
      </div>

    </div>
  </div>
</div>

<div id="toast-container"></div>

<script src="../../js/data.js"></script>
<script src="../../js/utils.js"></script>
<script src="../../js/api.js"></script>
<script src="../../js/app.js"></script>
<script src="../../js/notifications.js"></script>
<script src="../../js/student.js"></script>
</body>
</html>
