<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <!-- Applies the saved light/dark choice before first paint -->
  <script src="../../js/theme.js"></script>
  <title>OPSTS – Manage Projects</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
  <link rel="stylesheet" href="../../css/tailwind.css" />
</head>
<body>
<div class="app-shell">
  <aside class="sidebar">
    <div class="sidebar-brand">
      <img src="../../assets/images/logo.png" alt="OPSTS Logo" />
      <div class="brand-text">OPSTS<small>Admin Portal</small></div>
    </div>
    <div class="sidebar-user">
      <div class="avatar" id="sideAvatar"></div>
      <div><div class="u-name" id="sideUserName"></div><div class="u-role" id="sideUserMeta"></div></div>
    </div>
    <nav class="sidebar-nav" aria-label="Primary">
      <div class="nav-section">Management</div>
      <button type="button" class="nav-item" data-page="dashboard.html"><span class="nav-icon"><i class="fa-solid fa-house"></i></span><span class="nav-label">Dashboard</span></button>
      <button type="button" class="nav-item" data-page="users.html"><span class="nav-icon"><i class="fa-solid fa-users"></i></span><span class="nav-label">Manage Users</span></button>
      <button type="button" class="nav-item active" data-page="projects.html" aria-current="page"><span class="nav-icon"><i class="fa-solid fa-folder-open"></i></span><span class="nav-label">Manage Projects</span></button>
      <button type="button" class="nav-item" data-page="assign.html"><span class="nav-icon"><i class="fa-solid fa-link"></i></span><span class="nav-label">Assign Supervisors</span></button>
      <div class="nav-section">Reports</div>
      <button type="button" class="nav-item" data-page="reports.html"><span class="nav-icon"><i class="fa-solid fa-chart-pie"></i></span><span class="nav-label">Reports</span></button>
      <div class="nav-section">Account</div>
      <button type="button" class="nav-item" data-page="notifications.html"><span class="nav-icon"><i class="fa-solid fa-bell"></i></span><span class="nav-label">Notifications</span><span class="nav-badge hidden" id="ntfBadge"></span></button>
      <button type="button" class="nav-item" data-page="profile.html"><span class="nav-icon"><i class="fa-solid fa-circle-user"></i></span><span class="nav-label">My Profile</span></button>
    </nav>
    <div class="sidebar-footer"><button class="btn-logout" id="logoutBtn"><i class="fa-solid fa-right-from-bracket"></i> Sign Out</button></div>
  </aside>

  <div class="main" id="main-content" role="main" tabindex="-1">
    <div class="topbar">
      <div class="topbar-left"><div class="topbar-title">Manage Projects <span>All student projects</span></div></div>
      <div class="topbar-actions">
        <button type="button" class="icon-btn" id="notifBtn" aria-label="Notifications"><i class="fa-solid fa-bell"></i><span class="dot hidden" id="ntfDot"></span></button>
        <button type="button" class="icon-btn" id="profileBtn" aria-label="My profile"><i class="fa-solid fa-circle-user"></i></button>
      </div>
    </div>

    <div class="page-content">
      <div class="page-header">
        <h1>Manage Projects</h1>
        <p>View and manage all student projects across the system.</p>
      </div>

      <div class="projects-toolbar">
        <div class="users-search">
          <input type="text" id="projectSearch" placeholder="Search by title or student…" />
        </div>
        <div class="role-filter-tabs">
          <button type="button" class="role-filter-tab active" data-status="all" aria-pressed="true">All</button>
          <button type="button" class="role-filter-tab" data-status="In Progress" aria-pressed="false">In Progress</button>
          <button type="button" class="role-filter-tab" data-status="Pending" aria-pressed="false">Pending</button>
          <button type="button" class="role-filter-tab" data-status="Completed" aria-pressed="false">Completed</button>
        </div>
      </div>

      <div class="card">
        <div class="table-wrap">
          <table>
            <thead>
              <tr>
                <th>Project Title</th>
                <th>Student</th>
                <th>Supervisor</th>
                <th>Start Date</th>
                <th>Progress</th>
                <th>Deadline</th>
                <th>Status</th>
                <th>Actions</th>
              </tr>
            </thead>
            <tbody id="projectsTable"></tbody>
          </table>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- Project Detail Modal -->
<div class="modal-overlay" id="projectDetailModal">
  <div class="modal">
    <div class="modal-header">
      <h2><i class="fa-solid fa-folder-open"></i> Project Details</h2>
      <button type="button" class="modal-close" id="closeProjectDetailModal" aria-label="Close dialog"><i class="fa-solid fa-xmark"></i></button>
    </div>
    <div class="modal-body">
      <div class="form-group"><label>Title</label><input type="text" id="pdTitle" readonly class="readonly-field" /></div>
      <div class="form-group"><label>Topic</label><input type="text" id="pdTopic" readonly class="readonly-field" /></div>
      <div class="form-row">
        <div class="form-group"><label>Student</label><input type="text" id="pdStudent" readonly class="readonly-field" /></div>
        <div class="form-group"><label>Supervisor</label><input type="text" id="pdSupervisor" readonly class="readonly-field" /></div>
      </div>
      <div class="form-row">
        <div class="form-group"><label>Start Date</label><input type="date" id="pdStartDate" /></div>
        <div class="form-group"><label>Deadline</label><input type="date" id="pdDeadline" /></div>
      </div>
      <div class="form-group"><label>Progress</label><input type="text" id="pdProgress" readonly class="readonly-field" /></div>
    </div>
    <div class="modal-footer">
      <button class="btn btn-ghost" id="cancelProjectDetailBtn">Close</button>
      <button class="btn btn-primary" id="saveProjectDatesBtn"><i class="fa-solid fa-floppy-disk"></i> Save Dates</button>
    </div>
  </div>
</div>

<div id="toast-container"></div>
<script src="../../js/data.js"></script>
<script src="../../js/utils.js"></script>
<script src="../../js/api.js"></script>
<script src="../../js/app.js"></script>
<script src="../../js/a11y.js"></script>
<script src="../../js/notifications.js"></script>
<script src="../../js/admin.js"></script>
</body>
</html>
